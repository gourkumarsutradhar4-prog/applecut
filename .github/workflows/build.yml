name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7 @capacitor/filesystem@7 @capacitor/share@7
      - run: npx cap add android
      - run: npx cap sync
      - name: Add permissions
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "RECORD_AUDIO" android/app/src/main/AndroidManifest.xml
      - name: App name and icon
        run: |
          S=android/app/src/main/res/values/strings.xml
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">Plumora Pro</string>#; s#<string name="title_activity_main">[^<]*</string>#<string name="title_activity_main">Plumora Pro</string>#' $S
          if [ -f icon.png ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for d in mdpi:48 hdpi:72 xhdpi:96 xxhdpi:144 xxxhdpi:192; do
              n=${d%%:*}; s=${d##*:}
              convert icon.png -resize ${s}x${s} android/app/src/main/res/mipmap-$n/ic_launcher.png
              cp android/app/src/main/res/mipmap-$n/ic_launcher.png android/app/src/main/res/mipmap-$n/ic_launcher_round.png
              cp android/app/src/main/res/mipmap-$n/ic_launcher.png android/app/src/main/res/mipmap-$n/ic_launcher_foreground.png
            done
          else echo "icon.png not found, keeping default icon"; fi
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Plumora-Pro-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
