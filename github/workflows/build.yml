name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm i @capacitor/core @capacitor/cli @capacitor/android @capacitor/filesystem @capacitor/share
      - run: npx cap add android
      - run: npx cap sync
      - name: Add microphone permission
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' android/app/src/main/AndroidManifest.xml
          grep -n "RECORD_AUDIO" android/app/src/main/AndroidManifest.xml
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: applecut-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
