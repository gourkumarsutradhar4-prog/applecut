<title>Plumora Pro</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  /* Layout: one-screen phone editor. Preview on top, a scrub-by-scrolling timeline under it, a tool strip at the bottom. */
  --bg:#0d0f14; --panel:#151821; --raise:#1d212c; --line:#2a2f3c; --fg:#eceff5; --dim:#8b93a5;
  --accent:#ffc233; --accent-ink:#1a1400; --clip:#2c3a5a; --img:#3c3556; --txt:#6e5112; --aud:#1f4a4c; --ov:#4d3470; --danger:#ff7a7a;
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans Bengali","Noto Sans",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font);overflow:hidden;overscroll-behavior:none;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer}
#app{height:100%;display:flex;flex-direction:column;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px;min-width:0}
.top{display:flex;align-items:center;gap:6px;flex:none}
.brand{font-weight:800;letter-spacing:.02em;font-size:17px;margin-right:2px}
.brand b{color:var(--accent)}
.spacer{flex:1}
.icon-btn{width:40px;height:40px;border-radius:12px;border:0;background:var(--raise);display:grid;place-items:center;flex:none}
.icon-btn:disabled{opacity:.35}
.primary{height:40px;padding:0 16px;border:0;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700}
.stage{flex:1;min-height:0;position:relative;background:#000;border-radius:14px;display:grid;place-items:center;overflow:hidden}
#cv{display:block;border-radius:2px;touch-action:none}
#empty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;text-align:center}
#empty[hidden]{display:none}
#empty h2{margin:0;font-size:18px}
#empty p{margin:0;color:var(--dim);font-size:13px;max-width:30ch}
.btn{height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--raise);font-weight:600}
.btn.accent{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.danger{color:var(--danger)}
.btn.sm{height:36px;padding:0 12px;font-size:13px}
.transport{display:flex;align-items:center;gap:8px;flex:none}
#time{font:600 13px var(--mono);font-variant-numeric:tabular-nums;color:var(--dim)}
#time b{color:var(--fg);font-weight:600}
.tlwrap{position:relative;flex:none}
#tl{position:relative;overflow:auto;background:var(--panel);border-radius:12px;height:178px;scrollbar-width:none;overscroll-behavior:contain}
#tl::-webkit-scrollbar{display:none}
#inner{position:relative;width:max-content;min-width:100%;padding-top:4px;padding-bottom:6px}
#track{position:relative}
#ruler{position:relative;height:18px}
.tick{position:absolute;top:0;height:100%;border-left:1px solid var(--line);padding-left:3px;font:10px var(--mono);color:var(--dim);white-space:nowrap}
.row{position:relative;margin-top:5px}
.row.c{height:58px}
#ph{position:absolute;left:50%;top:0;bottom:0;width:2px;margin-left:-1px;background:var(--accent);pointer-events:none;z-index:8;border-radius:2px}
#ph::before{content:"";position:absolute;top:-1px;left:-4px;border:5px solid transparent;border-top-color:var(--accent);border-bottom:0}
.blk{position:absolute;height:22px;border-radius:7px;overflow:hidden;box-sizing:border-box;border:1px solid rgba(255,255,255,.14)}
.row.c .blk{height:100%;border-radius:8px}
.blk.clip{background-color:var(--clip);background-repeat:repeat-x;background-size:auto 100%}
.blk.clip.img{background-color:var(--img)}
.blk.txt{background:var(--txt);border-color:rgba(255,194,51,.35)}
.blk.ov{background:var(--ov);border-color:rgba(190,150,255,.4)}
.blk.aud{background:linear-gradient(90deg,transparent 0 3px,rgba(255,255,255,.16) 3px 4px) 0 0/6px 100%,var(--aud)}
.blk.sel{outline:2px solid var(--accent);outline-offset:-2px;z-index:3}
.blk.sel:not(.clip){touch-action:none}
.lbl{position:absolute;left:5px;bottom:3px;font:600 10px var(--mono);background:rgba(0,0,0,.6);padding:1px 4px;border-radius:4px;color:#fff;white-space:nowrap;max-width:calc(100% - 10px);overflow:hidden;text-overflow:ellipsis}
.blk:not(.clip) .lbl{position:static;display:block;background:none;padding:3px 7px;font:600 11px var(--font);line-height:16px}
.trn{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,rgba(255,194,51,.55),transparent);pointer-events:none}
.beat{position:absolute;top:0;bottom:0;width:1px;background:rgba(255,255,255,.45);pointer-events:none}
.h{position:absolute;top:0;bottom:0;width:18px;display:none;background:var(--accent);touch-action:none;z-index:4}
.h.l{left:0;border-radius:7px 0 0 7px}.h.r{right:0;border-radius:0 7px 7px 0}
.h::after{content:"";position:absolute;left:50%;top:30%;bottom:30%;width:2px;margin-left:-1px;background:var(--accent-ink);opacity:.7;border-radius:2px}
.sel>.h{display:block}
#sheet{flex:none;background:var(--panel);border-radius:14px;padding:12px;max-height:42%;overflow-y:auto;display:flex;flex-direction:column;gap:12px;user-select:none}
.sh-head{display:flex;align-items:center;gap:8px}
.sh-head h3{margin:0;font-size:14px;flex:1}
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>span.k{font-size:12px;color:var(--dim);display:flex;justify-content:space-between}
.field output{font:600 12px var(--mono);color:var(--fg)}
.tabbody{display:flex;flex-direction:column;gap:12px}
input[type=range]{width:100%;accent-color:var(--accent);height:28px}
input[type=text],textarea,select{width:100%;box-sizing:border-box;background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font:600 15px var(--font);user-select:text;-webkit-user-select:text}
textarea{min-height:56px;resize:none;font-size:16px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{height:36px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--raise);font-size:13px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--bg) inset}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:6px}
.grid button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--raise);font-size:24px;line-height:1;padding:0;display:grid;place-items:center}
.grid button canvas{width:30px;height:30px}
.bar{height:10px;border-radius:999px;background:var(--raise);overflow:hidden}
.bar>i{display:block;height:100%;width:0;background:var(--accent)}
.note{font-size:12px;color:var(--dim);line-height:1.5;margin:0}
.list{display:flex;flex-direction:column;gap:8px}
.cap-row{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;background:var(--raise);border-radius:10px;padding:8px}
.cap-row .t{font:11px var(--mono);color:var(--dim)}
.tools{display:flex;gap:2px;overflow-x:auto;flex:none;scrollbar-width:none;padding-bottom:2px}
.tools::-webkit-scrollbar{display:none}
.tool{flex:0 0 auto;min-width:62px;display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;font-size:11px;padding:8px 5px;border-radius:12px;color:var(--fg);white-space:nowrap}
.tool:active,.icon-btn:active{background:var(--line)}
.tool.accent{color:var(--accent)}
.tool.danger{color:var(--danger)}
svg.i{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.f{fill:currentColor;stroke:none}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;z-index:50;max-width:88%;text-align:center;pointer-events:none}
#hold{position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none;overflow:hidden}
video.res{width:100%;max-height:30vh;border-radius:10px;background:#000;user-select:auto}
@media (prefers-reduced-motion:no-preference){.tool,.chip,.btn{transition:background .12s}}

#home{position:fixed;inset:0;z-index:50;overflow:auto;background:#f5f3ff;color:#1b1633;font-family:var(--font);-webkit-overflow-scrolling:touch}
#home[hidden]{display:none}
#home .hero{position:relative;height:220px;padding:calc(env(safe-area-inset-top,0px) + 28px) 22px 0;color:#fff;background:radial-gradient(circle at 78% 30%,#ff9aa8 0 9%,transparent 10%),linear-gradient(160deg,#1b1240 0%,#4a2a9a 55%,#8a4fd8 100%);overflow:hidden}
#home .hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:60px;background:linear-gradient(transparent,#f5f3ff)}
#home .hero i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.8}
#home .hero h1{margin:0;font-size:30px;letter-spacing:.3px}#home .hero h1 b{color:#ffc233}
#home .hero p{margin:6px 0 0;opacity:.85;font-size:14px}
#home .pad{padding:0 16px 96px;margin-top:-50px;position:relative;z-index:2}
#home .cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#home .big{height:112px;border-radius:20px;border:0;background:#e5defc;color:#1b1633;font:700 15px var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;box-shadow:0 4px 14px rgba(70,40,150,.12)}
#home .big .ic{width:44px;height:44px;border-radius:13px;background:#1b1633;color:#fff;display:grid;place-items:center}
#home .big svg{flex:none;width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#home h3{margin:22px 4px 10px;font-size:17px}
#home .rec{display:flex;gap:10px;overflow:auto;padding-bottom:4px}
#home .rc{flex:none;width:112px;height:148px;border-radius:14px;background:#d9d2f3 center/cover;position:relative;border:0;color:#fff;text-align:left;overflow:hidden}
#home .rc span{position:absolute;left:0;right:0;bottom:0;padding:18px 8px 7px;font:600 11px var(--font);background:linear-gradient(transparent,rgba(0,0,0,.7))}
#home .rc.none{display:grid;place-items:center;color:#6b5fa0;background:#e9e4fb;font:600 12px var(--font);padding:10px;text-align:center}
#home .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px 4px}
#home .tl{height:auto;background:none;border:0;color:#1b1633;font:600 13px var(--font);display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 4px}
#home .tl svg{flex:none;width:30px;height:30px;stroke:#1b1633;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#home .tl small{display:block;font-size:10px;color:#8a7fb8;font-weight:500}
#home .list{display:grid;gap:10px}
#home .row2{height:auto;display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:#fff;border:0;text-align:left;color:#1b1633;font:600 14px var(--font);box-shadow:0 2px 8px rgba(70,40,150,.08)}
#home .row2 small{display:block;color:#7a70a8;font-weight:500;font-size:12px;margin-top:2px}
#home .row2 .th{width:54px;height:54px;border-radius:10px;background:#d9d2f3 center/cover;flex:none}
#home .bnav{position:fixed;left:0;right:0;bottom:0;display:flex;background:#fff;border-top:1px solid #e3dcf7;padding-bottom:env(safe-area-inset-bottom,0px);z-index:3}
#home .bnav button{flex:1;height:62px;background:none;border:0;color:#9a90c4;font:600 11px var(--font);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
#home .bnav button.on{color:#1b1633}
#home .bnav svg{flex:none;width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.brand{cursor:pointer}
#home .hero .logo{width:72px;height:72px;display:block;margin:0 0 6px;border-radius:18px}
#toast{z-index:300}
#home #hPill{position:absolute;right:16px;top:calc(env(safe-area-inset-top,0px) + 22px);height:30px;padding:0 14px;border-radius:15px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.14);color:#fff;font:700 12px var(--font);z-index:3}
#home #hPill.pro{background:#ffc233;color:#1a1400;border-color:transparent}
#home .form{display:grid;gap:10px;background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 8px rgba(70,40,150,.08)}
#home input{height:46px;border-radius:12px;border:1px solid #d9d2f3;background:#faf8ff;color:#1b1633;padding:0 14px;font:500 15px var(--font);width:100%;box-sizing:border-box;user-select:text;-webkit-user-select:text}
#home .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#home .pbtn{height:46px;border-radius:12px;border:1px solid #cfc5f3;background:#efeaff;color:#1b1633;font:700 14px var(--font)}
#home .pbtn.dark{background:#1b1633;color:#fff;border-color:transparent}
#home .lnk{background:none;border:0;color:#5a3fc0;font:600 13px var(--font);height:auto;text-align:left;padding:2px 0}
#home .hn{margin:0;color:#6b5fa0;font-size:13px;line-height:1.5}
#home .ben{margin:0;padding-left:18px;color:#1b1633;font-size:14px;line-height:1.8}
#home .plan{height:auto;padding:12px;border-radius:12px;border:2px solid #d9d2f3;background:#faf8ff;color:#1b1633;font:700 14px var(--font);display:flex;flex-direction:column;gap:4px;align-items:center}
#home .plan.on{border-color:#5a3fc0;background:#efeaff}
#home .plan small{font-size:16px;color:#5a3fc0}
#home .num{padding:12px;border-radius:12px;background:#1b1633;color:#ffc233;font:700 20px var(--mono);text-align:center;letter-spacing:1px;user-select:text;-webkit-user-select:text}
</style>

<div id="app">
  <header class="top">
    <div class="brand">Plumora <b>Pro</b></div>
    <div class="spacer"></div>
    <button class="icon-btn" id="undoBtn" aria-label="Undo" disabled></button>
    <button class="icon-btn" id="redoBtn" aria-label="Redo" disabled></button>
    <button class="icon-btn" id="gearBtn" aria-label="Settings"></button>
    <button class="primary" id="exportBtn">Export</button>
  </header>
  <main class="stage" id="stage">
    <canvas id="cv" width="960" height="540"></canvas>
    <div id="empty">
      <h2>Empty project</h2>
      <p>Add a video or photo to start editing. Or try the samples first.</p>
      <button class="btn accent" id="emptyAdd">+ Add media</button>
      <button class="btn" id="emptySample">Try with samples</button>
      <button class="btn" id="emptyDraft" hidden>Restore previous draft</button>
    </div>
  </main>
  <div class="transport">
    <button class="icon-btn" id="playBtn" aria-label="Play"></button>
    <div id="time"><b>0:00.0</b> / 0:00.0</div>
    <div class="spacer"></div>
    <button class="icon-btn" id="zoomOut" aria-label="Zoom out"></button>
    <button class="icon-btn" id="zoomIn" aria-label="Zoom in"></button>
  </div>
  <div class="tlwrap">
    <div id="tl"><div id="inner"><div id="track">
      <div id="ruler"></div>
      <div class="row" id="rowT" hidden></div>
      <div class="row" id="rowO" hidden></div>
      <div class="row c" id="rowC"></div>
      <div class="row" id="rowA" hidden></div>
    </div></div></div>
    <div id="ph"></div>
  </div>
  <section id="sheet" hidden></section>
  <nav class="tools" id="tools" aria-label="Tools"></nav>
</div>

const fade=(lt,L,fi,fo)=>Math.min(fi>0?clamp(lt/fi,0,1):1,fo>0?clamp((L-lt)/fo,0,1):1);
function distCurve(k){const n=2048,c=new Float32Array(n);for(let i=0;i<n;i++){const x=i*2/n-1;c[i]=(3+k)*x*20*(Math.PI/180)/(Math.PI+k*Math.abs(x))}return c}
class Chain{
  constructor(elm){const a=ensureAC();this.el=elm;this.src=a.createMediaElementSource(elm);
    this.hp=a.createBiquadFilter();this.hp.type='highpass';this.hp.frequency.value=10;
    this.lp=a.createBiquadFilter();this.lp.type='lowpass';this.lp.frequency.value=24000;
    this.gain=a.createGain();this.nodes=[];this.fx='none';this.nr=false;
    this.src.connect(this.hp);this.hp.connect(this.lp);this.lp.connect(this.gain);this.gain.connect(a.destination)}
  set(fx,nr){
    if(nr!==this.nr){this.nr=nr;this.hp.frequency.value=nr?120:10;this.lp.frequency.value=nr?7000:24000}
    if(fx===this.fx)return;this.fx=fx;
    try{this.lp.disconnect()}catch(e){}
    this.nodes.forEach(n=>{try{n.disconnect();if(n.stop)n.stop()}catch(e){}});this.nodes=[];
    const a=AC,dry=this.gain;
    if(fx==='echo'){const d=a.createDelay(1);d.delayTime.value=.28;const fb=a.createGain();fb.gain.value=.4;const w=a.createGain();w.gain.value=.55;
      this.lp.connect(dry);this.lp.connect(d);d.connect(fb);fb.connect(d);d.connect(w);w.connect(dry);this.nodes.push(d,fb,w)}
    else if(fx==='robot'){const mod=a.createGain();mod.gain.value=0;const o=a.createOscillator();o.frequency.value=55;o.connect(mod.gain);o.start();
      this.lp.connect(mod);mod.connect(dry);this.nodes.push(mod,o)}
    else if(fx==='phone'){const bp=a.createBiquadFilter();bp.type='bandpass';bp.frequency.value=1400;bp.Q.value=.9;this.lp.connect(bp);bp.connect(dry);this.nodes.push(bp)}
    else if(fx==='mega'){const hp=a.createBiquadFilter();hp.type='highpass';hp.frequency.value=500;const ws=a.createWaveShaper();ws.curve=distCurve(40);
      this.lp.connect(hp);hp.connect(ws);ws.connect(dry);this.nodes.push(hp,ws)}
    else this.lp.connect(dry)}
}

async function loadMedia(f,id){
  id=id||nid();const url=URL.createObjectURL(f);ensureAC();
  const isImg=f.type.startsWith('image/')||(!f.type.startsWith('video/')&&/\.(gif|png|jpe?g|webp|bmp)$/i.test(f.name));
  if(isImg){const img=new Image();img.src=url;await img.decode();
    const gif=f.type==='image/gif'||/\.gif$/i.test(f.name);if(gif)$('#hold').append(img);
    const m={id,kind:'image',el:img,w:img.naturalWidth,h:img.naturalHeight,dur:120,thumb:thumbOf(img,img.naturalWidth,img.naturalHeight),name:f.name,file:f,gif};
    M[id]=m;return m}
  const v=el('video',{playsinline:true,preload:'auto'});v.src=url;$('#hold').append(v);
  await once(v,'loadedmetadata');
  if(!isFinite(v.duration)||!v.videoWidth)throw new Error('bad video');
  v.currentTime=Math.min(.1,v.duration/2);await once(v,'seeked');
  const m={id,kind:'video',el:v,w:v.videoWidth,h:v.videoHeight,dur:v.duration,thumb:thumbOf(v,v.videoWidth,v.videoHeight),name:f.name,file:f,chain:new Chain(v)};
  M[id]=m;return m}
async function loadAudio(f,id){
  const url=URL.createObjectURL(f);const a=new Audio();a.preload='auto';a.src=url;await once(a,'loadedmetadata');
  let dur=a.duration;
  if(!isFinite(dur)||dur<=0){dur=(await ensureAC().decodeAudioData(await f.arrayBuffer())).duration}
  if(!isFinite(dur)||dur<=0)throw new Error('bad audio');
  AU[id]={id,el:a,chain:new Chain(a),dur,name:f.name,file:f};return AU[id]}

  o._bx={cx:cx/W,cy:cy/H,w:bw/W,h:bh/H,rot}}

/* ---------- draw: text ---------- */
function fontStack(k){return(FONTS.find(f=>f[0]===k)||FONTS[0])[2]}
function drawText(T,x,t){
  const ctx=T.ctx,W=ctx.canvas.width,H=ctx.canvas.height,lt=t-x.start,io=ioState(x.ai,x.ao,lt,x.dur);if(io.a<=.001)return;
  let txt=x.text;
  if(x.ai==='type'){const n=Math.floor(clamp(lt/Math.max(.2,Math.min(x.dur*.7,txt.length*.07)),0,1)*txt.length);txt=txt.slice(0,n)}
  const fs=Math.max(4,x.size/100*H*io.s),lh=fs*1.25;
  ctx.save();ctx.translate((x.x+io.dx)*W,(x.y+io.dy)*H);ctx.rotate((x.rot+io.r)*Math.PI/180);
  ctx.font=(x.italic?'italic ':'')+(x.bold?700:500)+' '+fs+'px '+fontStack(x.font);ctx.textAlign='center';ctx.textBaseline='middle';
  if('letterSpacing'in ctx)ctx.letterSpacing=(x.ls*fs/20)+'px';
  const lines=(x.text.length&&x.ai==='type'?txt:x.text).split('\n'),full=x.text.split('\n');
  const mw=Math.max(1,...full.map(l=>ctx.measureText(l).width)),bw=mw+fs*.8,bh=full.length*lh+fs*.1,y0=-(lines.length-1)*lh/2;
  if(x.bg){ctx.save();ctx.globalAlpha=io.a*x.bgOp;ctx.fillStyle=x.bgColor;ctx.beginPath();if(ctx.roundRect)ctx.roundRect(-bw/2,-bh/2,bw,bh,fs*.25);else ctx.rect(-bw/2,-bh/2,bw,bh);ctx.fill();ctx.restore()}
  ctx.globalAlpha=io.a;
  if(x.shadow){ctx.shadowColor=x.shColor;ctx.shadowBlur=x.shBlur*H/540}
  if(x.stroke>0){ctx.lineWidth=x.stroke*fs*.04;ctx.strokeStyle=x.strokeColor;ctx.lineJoin='round';lines.forEach((l,i)=>ctx.strokeText(l,0,y0+i*lh))}
  ctx.fillStyle=x.color;lines.forEach((l,i)=>ctx.fillText(l,0,y0+i*lh));
  ctx.shadowBlur=0;
  if(T.ui&&S.sel===x){ctx.setLineDash([8,5]);ctx.strokeStyle='#ffc233';ctx.lineWidth=Math.max(2,W/400);ctx.strokeRect(-bw/2,-bh/2,bw,bh)}
  ctx.restore();
  x._bx={cx:(x.x+io.dx),cy:(x.y+io.dy),w:bw/W,h:bh/H,rot:(x.rot+io.r)*Math.PI/180}}

/* ---------- frame ---------- */
function renderFrame(T,t){
  const ctx=T.ctx,W=ctx.canvas.width,H=ctx.canvas.height;
  ctx.save();ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  ctx.fillStyle=S.bg.mode==='color'?S.bg.color:'#000';ctx.fillRect(0,0,W,H);
  const c=clipAt(t);if(c)drawMain(T,c,t);
  for(const o of S.ovs)if(t>=o.start&&t<o.start+o.dur)drawOv(T,o,t);
  for(const x of S.texts)if(t>=x.start&&t<x.start+x.dur)drawText(T,x,t);
  if(S.wm.on&&S.wm.text){const fs=S.wm.size/100*H,pad=fs*.8;ctx.globalAlpha=S.wm.op;ctx.font='700 '+fs+'px '+fontStack('sans');ctx.fillStyle='#fff';ctx.shadowColor='rgba(0,0,0,.6)';ctx.shadowBlur=fs*.3;
    const p=S.wm.pos;ctx.textAlign=p.includes('r')?'right':p.includes('l')?'left':'center';ctx.textBaseline=p.includes('b')?'bottom':p.includes('t')?'top':'middle';
    ctx.fillText(S.wm.text,p.includes('r')?W-pad:p.includes('l')?pad:W/2,p.includes('b')?H-pad:p.includes('t')?pad:H/2)}
  ctx.restore()}

/* ================= timeline ================= */
const tl=$('#tl'),track=$('#track'),inner=$('#inner');
const blks=new Map();let progScroll=-999,noClickUntil=0;
function layout(){let s=0;for(const c of S.clips){c.start=s;s+=len(c)}S.total=s;S.t=clamp(S.t,0,S.total)}
function clipAt(t){for(const c of S.clips)if(t>=c.start&&t<c.start+len(c))return c;return S.clips.length?S.clips[S.clips.length-1]:null}
function packLanes(items,gs,ge){const ends=[],arr=[...items].sort((a,b)=>gs(a)-gs(b));
  for(const it of arr){let l=0;while(ends[l]!==undefined&&ends[l]>gs(it)+1e-3)l++;ends[l]=ge(it);it._lane=l}return Math.max(1,ends.length)}
const itDur=(it,kind)=>kind==='aud'?it.len:kind==='clip'?len(it):it.dur;
function place(b,it,kind){b.style.left=(it.start*S.pps)+'px';b.style.width=Math.max(18,itDur(it,kind)*S.pps-2)+'px';if(kind!=='clip')b.style.top=((it._lane||0)*24)+'px'}
function setScroll(x){progScroll=x;tl.scrollLeft=x}
function mkBlk(cls,kind,item,label){
  const b=el('div',{class:'blk '+cls+(S.sel===item?' sel':''),onclick:e=>{e.stopPropagation();if(performance.now()<noClickUntil)return;select(item,kind)}});
  if(kind==='clip')b.append(el('i',{class:'h l',onpointerdown:e=>startTrim(e,item,'l')}),el('i',{class:'h r',onpointerdown:e=>startTrim(e,item,'r')}));
  else{b.append(el('i',{class:'h l',onpointerdown:e=>startBlk(e,item,kind,'l')}),el('i',{class:'h r',onpointerdown:e=>startBlk(e,item,kind,'r')}));
    b.addEventListener('pointerdown',e=>{if(S.sel===item&&!e.target.classList.contains('h'))startBlk(e,item,kind,'move')})}
  b.append(el('span',{class:'lbl'},label));b._lbl=b.querySelector('.lbl');return b}
const clipLabel=c=>fmt(len(c)).replace(/^0:/,'')+'s'+(c.speed!==1?' · '+(+c.speed.toFixed(2))+'x':'');
function renderTL(){
  layout();blks.clear();
  const pad=tl.clientWidth/2;inner.style.paddingLeft=inner.style.paddingRight=pad+'px';
  track.style.width=Math.max(S.total*S.pps,1)+'px';
  const ruler=$('#ruler'),rowT=$('#rowT'),rowO=$('#rowO'),rowC=$('#rowC'),rowA=$('#rowA');
  [ruler,rowT,rowO,rowC,rowA].forEach(r=>r.replaceChildren());
  const step=S.pps>=120?.5:S.pps>=50?1:S.pps>=28?2:5;
  for(let s=0;s<=S.total+.001;s+=step){const tk=el('div',{class:'tick'},Number.isInteger(s)?(Math.floor(s/60)+':'+String(s%60).padStart(2,'0')):'');tk.style.left=(s*S.pps)+'px';ruler.append(tk)}
  rowT.hidden=!S.texts.length;if(S.texts.length){const n=packLanes(S.texts,x=>x.start,x=>x.start+x.dur);rowT.style.height=(n*24)+'px';
    for(const x of S.texts){const b=mkBlk('txt','text',x,x.text.split('\n')[0]);place(b,x,'text');blks.set('t'+x.id,b);rowT.append(b)}}
  rowO.hidden=!S.ovs.length;if(S.ovs.length){const n=packLanes(S.ovs,x=>x.start,x=>x.start+x.dur);rowO.style.height=(n*24)+'px';
    for(const o of S.ovs){const b=mkBlk('ov','ov',o,o.kind==='emoji'?o.ch:o.kind==='shape'?'◆ Shape':(M[o.mid]?M[o.mid].name:'Overlay'));place(b,o,'ov');blks.set('o'+o.id,b);rowO.append(b)}}
  for(const c of S.clips){const m=M[c.mid];
    const b=mkBlk('clip'+(m&&m.kind==='image'?' img':''),'clip',c,clipLabel(c));
    if(m)b.style.backgroundImage='url("'+m.thumb+'")';
    if(c.trans.type!=='none'){const tr=el('div',{class:'trn'});tr.style.width=(c.trans.dur*S.pps)+'px';b.append(tr)}
    place(b,c,'clip');blks.set(c.id,b);rowC.append(b)}
  rowA.hidden=!S.auds.length;if(S.auds.length){const n=packLanes(S.auds,a=>a.start,a=>a.start+a.len);rowA.style.height=(n*24)+'px';
    for(const a of S.auds){const b=mkBlk('aud','aud',a,(a.kind==='extract'?'':'♪ ')+a.name);place(b,a,'aud');
      if(a.beats)for(const bt of a.beats){if(bt>=a.in&&bt<=a.in+a.len){const bm=el('div',{class:'beat'});bm.style.left=((bt-a.in)*S.pps)+'px';b.append(bm)}}
      blks.set('a'+a.id,b);rowA.append(b)}}
  setScroll(S.t*S.pps)}
function posTL(){
  layout();track.style.width=Math.max(S.total*S.pps,1)+'px';
  for(const c of S.clips){const b=blks.get(c.id);if(b){place(b,c,'clip');b._lbl.textContent=clipLabel(c)}}
  for(const x of S.texts){const b=blks.get('t'+x.id);if(b){place(b,x,'text');b._lbl.textContent=x.text.split('\n')[0]}}
  for(const o of S.ovs){const b=blks.get('o'+o.id);if(b)place(b,o,'ov')}
  for(const a of S.auds){const b=blks.get('a'+a.id);if(b)place(b,a,'aud')}}
tl.addEventListener('scroll',()=>{if(Math.abs(tl.scrollLeft-progScroll)<2||S.exporting)return;S.t=clamp(tl.scrollLeft/S.pps,0,S.total)});
const stopPlayTouch=()=>{if(S.playing&&!S.exporting){S.playing=false;updPlay()}};
tl.addEventListener('touchstart',stopPlayTouch,{passive:true});tl.addEventListener('pointerdown',stopPlayTouch);
tl.addEventListener('click',e=>{if(S.sel&&!e.target.closest('.blk'))select(null,null)});
new ResizeObserver(()=>renderTL()).observe(tl);
function zoom(f){S.pps=clamp(S.pps*f,16,420);renderTL()}

function startTrim(e,c,side){
  e.stopPropagation();e.preventDefault();pushHist();const x0=e.clientX,in0=c.in,out0=c.out,h=e.currentTarget,m=M[c.mid];h.setPointerCapture(e.pointerId);
  const mv=ev=>{const d=(ev.clientX-x0)/S.pps*c.speed;
    if(side==='l')c.in=clamp(in0+d,0,c.out-.2);else c.out=clamp(out0+d,c.in+.2,m?m.dur:out0);posTL()};
  const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);
    noClickUntil=performance.now()+300;layout();setScroll(S.t*S.pps);dirty()};
  h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up)}
function startBlk(e,item,kind,mode){

  const x0=e.clientX,s0=item.start,d0=kind==='aud'?item.len:item.dur,in0=item.in||0,h=e.cur
